[project]
name = "evaluator"
version = "0.1.0"
description = "Evidence-backed grader for codebase submissions"
readme = "README.md"
authors = [
    { name = "psinhagrid", email = "158988758+psinhagrid@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "fastapi>=0.162.0",
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.22.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
evaluate = "evaluator.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
